<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>PC Production Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header + tab rail, then one working canvas per view; tables scroll inside their own frames. */
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --surface-2:#E7E9E3; --ink:#17202A; --muted:#5A6570; --line:#D3D7CE;
  --accent:#1C6680; --accent-soft:#D6E8EE; --on-accent:#FFFFFF; --copper:#A85A22;
  --good:#2A7346; --good-soft:#D8EEDF; --warn:#946600; --warn-soft:#F5E8C4; --bad:#AE3624; --bad-soft:#F6DCD6;
  --h0:#F3E0DA; --h1:#F2EBCF; --h2:#DCEBD9; --h3:#B9DCC3; --h4:#8CC6A0;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1419; --surface:#161D24; --surface-2:#1E2730; --ink:#E4E9EE; --muted:#93A0AC; --line:#2A3540;
  --accent:#5AB0CF; --accent-soft:#16323D; --on-accent:#08141A; --copper:#E0915A;
  --good:#5BC283; --good-soft:#163222; --warn:#E2B544; --warn-soft:#352B10; --bad:#F08069; --bad-soft:#3A1A14;
  --h0:#3A1D17; --h1:#332B12; --h2:#1A3122; --h3:#1F4A2E; --h4:#2B6B41; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#161D24; --surface-2:#1E2730; --ink:#E4E9EE; --muted:#93A0AC; --line:#2A3540;
  --accent:#5AB0CF; --accent-soft:#16323D; --on-accent:#08141A; --copper:#E0915A;
  --good:#5BC283; --good-soft:#163222; --warn:#E2B544; --warn-soft:#352B10; --bad:#F08069; --bad-soft:#3A1A14;
  --h0:#3A1D17; --h1:#332B12; --h2:#1A3122; --h3:#1F4A2E; --h4:#2B6B41; color-scheme:dark}
*{box-sizing:border-box}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;white-space:nowrap}
.brand .tick{width:10px;height:10px;background:var(--copper);display:inline-block;transform:rotate(45deg);margin-right:2px}
.datainfo{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.datainfo b{color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em;color:var(--muted);text-decoration:none;padding:8px 12px 9px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0;max-width:75ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.grid2>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
select,input[type=text],input[type=number],input[type=date],input[type=search]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0;max-width:100%}
input[type=search]{min-width:min(260px,100%)}
select:focus,input:focus,button:focus-visible,a:focus-visible,tr[data-go]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--f-body);font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:4px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero .v{font-size:40px;color:var(--accent)}
.up{color:var(--good)} .down{color:var(--bad)}
.tbl-wrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl-wrap.tall{max-height:640px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;z-index:1;cursor:default;user-select:none}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--ink)}
th.sorted::after{content:" ▾";color:var(--accent)} th.sorted.asc::after{content:" ▴"}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
td.wrap{white-space:normal;min-width:220px;max-width:420px}
tr[data-go]{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;background:var(--surface-2);position:sticky;bottom:0}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.grade{font-family:var(--f-display);font-weight:700;font-size:15px;display:inline-block;min-width:28px;text-align:center;padding:1px 6px;border-radius:4px}
.meter{position:relative;height:8px;background:var(--surface-2);border-radius:4px;min-width:90px;overflow:visible}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.meter>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.mcell{display:flex;align-items:center;gap:8px;min-width:150px}
.mcell .meter{flex:1}
.mcell span{font-family:var(--f-mono);font-size:12.5px;min-width:46px;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--f-mono);font-weight:500}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.heat td.h{text-align:center;font-family:var(--f-mono);font-size:12px;padding:6px 4px;min-width:52px;color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;display:inline-block;border-radius:2px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 18px}
.dl div{min-width:0}
.dl dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.dl dd{margin:2px 0 0;font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px}
.crumbs .arrow{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:40px 24px;text-align:center;background:var(--surface);max-width:720px;margin:40px auto}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{margin-bottom:8px}
.drop p{color:var(--muted);max-width:56ch;margin:6px auto 18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:13px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:4px;padding:8px 10px;max-width:90ch}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.flag{font-size:11px;font-weight:600;color:var(--bad)}
.kw input{width:100%}
.check-n{font-family:var(--f-display);font-weight:700;font-size:26px;min-width:56px;text-align:right}
details summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
.list-inline{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7;overflow-wrap:anywhere}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.finder{position:relative;flex:0 1 300px;min-width:0}
.finder input{width:100%;min-width:0;padding:7px 10px;font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border-color:transparent}
.finder input:focus{background:var(--surface);border-color:var(--accent)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:8;max-height:360px;overflow:auto}
.sug button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 12px;border-bottom:1px solid var(--line)}
.sug button:last-child{border-bottom:0}
.sug button:hover,.sug button.on{background:var(--accent-soft)}
.sug .w{font-family:var(--f-mono);font-size:13px;font-weight:500}
.sug .s{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lookup-wrap{border-top:1px solid var(--line);background:var(--bg);max-height:calc(100vh - 140px);overflow:auto}
.lookup{padding-block:14px 16px}
.lk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.lk-top h3{font-size:24px}
.lk-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.lk-big>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:0}
.lk-big .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.lk-big .v{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.lk-big .b .v{color:var(--good)} .lk-big .nb .v{color:var(--copper)}
.splitbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin:4px 0 12px}
.splitbar i{display:block;height:100%}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:6px 10px 6px 0;flex:none;align-self:center}
.seg button{border:0;background:var(--surface);color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:14px;padding:5px 12px;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:3px}
.hb-v{font-family:var(--f-mono);font-size:12.5px;text-align:right;white-space:nowrap}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.kpi-l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:6px}
.kpi-l b{color:var(--ink);font-family:var(--f-display);font-size:16px;margin-left:4px}
.names{font-size:13px;line-height:1.7}
.steps{display:flex;flex-wrap:wrap;gap:0;border-left:2px solid var(--line);margin-left:6px}
.step{flex-basis:100%;position:relative;padding:4px 0 6px 16px;display:flex;gap:10px;align-items:baseline;font-size:13px}
.step::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.step.future::before{background:var(--surface);border:2px solid var(--accent);width:6px;height:6px}
.step b{font-family:var(--f-mono);font-weight:500;font-size:12.5px;min-width:96px}
.step span{color:var(--muted)}
@media (max-width:640px){.hb{grid-template-columns:minmax(90px,120px) 1fr auto}.finder{flex-basis:100%;order:4}.brand h1{font-size:19px}.kpi .v{font-size:24px}.kpi.hero .v{font-size:32px}h2{font-size:22px}.datainfo{flex-basis:100%;order:3}}
</style>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><span class="tick" aria-hidden="true"></span><h1>PC Production Tracker</h1></div>
      <div class="datainfo" id="datainfo">No workbook loaded</div>
      <div class="finder" id="finder">
        <label for="woFind" class="sr">Look up a work order</label>
        <input type="search" id="woFind" placeholder="Look up WO #  ( / )" autocomplete="off" spellcheck="false" aria-controls="woSug" aria-autocomplete="list">
        <div class="sug" id="woSug" role="listbox" hidden></div>
      </div>
      <input type="file" id="file" accept=".xlsx,.xlsm,.xlsb,.xls" multiple hidden>
      <button class="btn" id="refreshBtn" type="button" title="Re-read the workbooks after you refresh and save them in Excel">↻ Refresh</button>
      <button class="btn primary" id="uploadBtn" type="button">Upload workbooks</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
  </div>
  <div class="lookup-wrap" id="lookupWrap" hidden><div class="wrap"><section class="lookup" id="lookup" aria-live="polite"></section></div></div>
</header>
<main class="wrap" id="main"><div class="empty"><span class="spinner"></span> Loading…</div></main>
<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script id="core">
/* ===== Core: workbook parsing + every calculation. Pure functions, no DOM. ===== */
var Core = (function () {
  'use strict';
  var OH = '00000000', TR = '00000001';
  var DESIGN_TASKS = ['pole foreman', 'gdt', 'maximo/deliverables', 'delivered to tech review', 'other (explain in notes.)',
    'support', 'qaqc corrections', 'pf corrections', 'gdt corrections', 'max/del corrections'];
  var CATCH_ALL = ['Other', 'Other (Explain in notes.)', 'Multiple (See Notes)', 'Research (Add Note)', 'Permit (Explain in Notes)', 'Entergy Training (Add Note)'];
  var KEYWORDS = ['GDT', 'Pole Foreman', 'Photos', 'Vicinity Map', 'Maximo', 'Deliverable', 'Permit', 'Meeting', 'Training', 'Login', 'Setup', 'Sketch', 'JHA', 'Environmental', 'Corrections'];
  var DEFAULTS = {
    rates: { PF: [1, 0.75], GDT: [1, 0.75], Corrections: [0.75, 0.25], 'Max/Del': [3, 0.5], QC: [2, 0.75], PC: [1, 0.2], PM: [1, 0.2] },

  };
  var DESIGN_RATE_KEYS = ['PF', 'GDT', 'Corrections', 'Max/Del'];
  // Same cleanup the workbooks' Power Queries apply to the Production Tracker list
  var EXCLUDE_NAMES = ['Abraham Nambos', 'Alejandro Montejano', 'Art Bautista', 'Baltazar Garcia', 'Breana Wright', 'Carlos Marquez', 'Cesar Avila', 'Christina Hill', 'Daisy Hernandez', "De'Anthony Davis", 'Drew Gayle', 'Edwin Garcia Reyes', 'Emma Benitez', 'Glenn Caldwell', 'Holly Brown', 'Javier Avila (Santiago)', 'Javier Avila-Santiago', 'Jay Sippel', 'Jayci Gibson', 'Jessica Johnson', 'Justin Kruger', 'Matthew Martinez', 'Neomi Bazan', 'Nickbert Emepue', 'Rachel Emerine', 'Rigel Ganac', 'Steven White', 'Uriel Morales', 'Yazan Saydawi', 'Zamira Andrade', 'Jaucelyn Gibson'];
  // One spelling per person across every sheet
  var ALIASES = { 'marlene lozano gallegos': 'Marlene Lozano', 'joe avalos': 'Joey Avalos', 'christopher umanzor': 'Chris Umanzor', 'nicholas millunzi': 'Nick Millunzi', 'nickalus ngo': 'Nick Ngo',
    'danton joseph kusaj': 'Danton Kusaj', 'vaishnavi chandra tella': 'Vaishnavi Chandra', 'vaishnavi tella': 'Vaishnavi Chandra', 'jacob stanley': 'Corben Stanley', 'martin esquivel barboza': 'Martin Esquivel' };
  function person(v) { var n = String(v == null ? '' : v).replace(/\s+/g, ' ').trim(); return ALIASES[n.toLowerCase()] || n; }
  var STATUS_MAP = { 'Ready to Field (Designer)': 'New', 'Ready to Field': 'New', 'Ready For Strand Mapping': 'New', 'Field Complete': 'New', 'Not Started': 'New', 'In Design': 'Design',
    'QAQC Needed': 'Contractor Tech Review', 'QAQC In Progress': 'Contractor Tech Review', 'QAQC Complete': 'Contractor Tech Review', 'Corrections Needed': 'Design', 'Corrections in Progress': 'Design',
    'PC Review': 'Contractor Tech Review', 'Waiting on Veg Estimate': 'Waiting on Entergy Response', 'Waiting on Entergy Response': 'Waiting on Entergy Response', 'Hold Pending Permit': 'Hold Pending Permit',
    'Pending Tech Review': 'Waiting on Entergy Approval', 'Tech Review Revisions': 'Design', 'Approved': 'Approved', 'Approved - Holding for Permit': 'Approved - Waiting on VEG',
    'Approved - Pending Payment': 'Approved - Pending Payment', 'Sent to Network/Construction': 'Complete - Sent to Const/Ntwk', 'Canceled': 'Cancelled', 'Hold-Add a Note': 'Design', 'Go Backs Needed': 'Design' };

}

  });

  T.eff = T.b + T.n ? T.b / (T.b + T.n) : null;

  var below = rows.filter(function (r) { return r.eff != null && r.eff < target(); }).length;

  var weekOpts = Core.weeksBetween(M.minDay, M.maxDay).reverse().map(function (w) { return [w, 'Week of ' + fd(w) + (w + 6 > M.maxDay ? ' (in progress)' : '')]; });
  var dlt = T.eff != null && pe != null ? T.eff - pe : null;
  var h = '<div class="head"><div><h2>Team efficiency</h2><p class="sub">Billable share of Entergy hours, plus all TS New Hire hours, for ' + fd(ws, false) + ' – ' + fd(ws + 6) + '. Overhead (00000000) and training (00000001) are shown separately.</p></div>' +
    '<div class="row">' + sel('effWeek', 'eff.week', weekOpts, ws, 'Focus week') + sel('effLoc', 'eff.loc', [['all', 'All locations']].concat(locations()), u.loc, 'Location') +

  if (f === 'est.start' && App.ui.est.des && emp(App.ui.est.des)) { App.ui.est.day = (Core.toDay(v) || todayDay()) - emp(App.ui.est.des).start + 1; }
  if (f === 'est.wo') { var o = App.M.woMap[String(v).trim()]; if (o && o.wp != null) App.ui.est.wp = o.wp; }
  if (f === 'est.skip') App.ui.est.skip = v === 'true';
  if (f.indexOf('wo.') === 0) App.ui.more_wo = false;
  if (e.type === 'input' && t.tagName === 'INPUT') { clearTimeout(typingTimer); typingTimer = setTimeout(render, 220); } else { clearTimeout(typingTimer); render(); }
}
document.addEventListener('change', function (e) { if (e.target.closest && e.target.closest('#lookupWrap,#finder')) return; if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') onField(e); });
document.addEventListener('input', function (e) { if (e.target.id === 'woFind') return; if (e.target.tagName === 'INPUT' && (e.target.type === 'search' || e.target.type === 'number')) onField(e); });
window.addEventListener('hashchange', function () { var v = location.hash.slice(1); if (VIEW_FN[v]) { App.view = v; lsSet('view', v); render.nav = true; render(); window.scrollTo(0, 0); } });
$('#uploadBtn').addEventListener('click', function () { pickFile(); });
$('#refreshBtn').addEventListener('click', function () { refreshFile(); });

/* ---------------- WO lookup (header search) ---------------- */
var sugIx = -1, sugList = [];
function showSug() {
  var q = $('#woFind').value, box = $('#woSug');
  if (!App.M || !q.trim()) { box.hidden = true; sugList = []; return; }
  sugList = Core.woSearch(App.M, q, 8); sugIx = sugList.length ? 0 : -1;
  if (!sugList.length) { box.innerHTML = '<div class="empty" style="padding:12px">No work order matches “' + esc(q) + '”.</div>'; box.hidden = false; return; }
  box.innerHTML = sugList.map(function (r, i) { return '<button type="button" role="option" data-pick="' + esc(r.wo) + '"' + (i === sugIx ? ' class="on"' : '') + '><span class="w">' + esc(r.wo) + '</span>' + (r.des ? ' <span class="muted" style="font-size:12px">· ' + esc(r.des) + '</span>' : '') + '<span class="s">' + esc(r.desc || ' ') + '</span></button>'; }).join('');
  box.hidden = false;
}
function openLookup(wo) {
  App.lookup = { wo: wo, roll: App.lookup && App.lookup.wo === wo ? App.lookup.roll : true };
  $('#woSug').hidden = true; $('#woFind').value = wo; renderLookup();
}
function closeLookup() { App.lookup = null; $('#lookupWrap').hidden = true; }
function renderLookup() {
  var L = App.lookup, wrap = $('#lookupWrap');
  if (!L || !App.M) { wrap.hidden = true; return; }
  var M = App.M, o = M.woMap[L.wo], hasRoll = o && o.set.length > 1;
  var r = Core.woHours(M, L.wo, hasRoll && L.roll), own = hasRoll ? Core.woHours(M, L.wo, false) : r;
  if (!r.entries && !o) { wrap.hidden = false; $('#lookup').innerHTML = '<div class="lk-top"><div><h3 class="mono">WO ' + esc(L.wo) + '</h3><p class="sub">No time has been charged to this work order in the loaded workbook.</p></div><button class="btn" data-act="lkClose" type="button">Close</button></div>'; return; }
  var bw = r.tot ? r.b / r.tot * 100 : 0, nw = r.tot ? r.n / r.tot * 100 : 0, xw = r.tot ? r.x / r.tot * 100 : 0;
  var h = '<div class="lk-top"><div><h3 class="mono">WO ' + esc(L.wo) + '</h3><p class="sub">' + esc(o ? [o.desc, o.des, o.st, o.ent ? 'Entergy: ' + o.ent : ''].filter(Boolean).join(' · ') : (L.wo === Core.OH ? 'Overhead' : L.wo === Core.TR ? 'Training' : '')) +
    (r.first != null ? ' · charged ' + fd(r.first) + ' – ' + fd(r.last) : '') + '</p></div><div class="row">' +
    (o ? '<button class="btn" data-act="lkOpen" type="button">Full details</button>' : '') + '<button class="btn" data-act="lkClose" type="button">Close</button></div></div>';
  if (hasRoll) h += '<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:10px"><input type="checkbox" id="lkRoll"' + (L.roll ? ' checked' : '') + '> Include earlier WO number' + (o.set.length > 2 ? 's' : '') + ' (' + o.set.slice(1).map(esc).join(', ') + ')</label>';
  h += '<div class="lk-big"><div class="b"><div class="l">Billable hrs</div><div class="v">' + fh(r.b) + '</div></div><div class="nb"><div class="l">Non-billable hrs</div><div class="v">' + fh(r.n) + '</div></div>' +
    '<div><div class="l">Total hrs charged</div><div class="v">' + fh(r.tot) + '</div></div><div><div class="l">Billable share</div><div class="v">' + pct(r.eff) + '</div></div>' +
    (r.x ? '<div><div class="l">Blank Billable? hrs</div><div class="v" style="color:var(--bad)">' + fh(r.x) + '</div></div>' : '') + '</div>';
  h += '<div class="splitbar" title="Billable ' + fh(r.b) + ' · Non-billable ' + fh(r.n) + '"><i style="width:' + bw + '%;background:var(--good)"></i><i style="width:' + nw + '%;background:var(--copper)"></i><i style="width:' + xw + '%;background:var(--bad)"></i></div>';
  var cols = [{ k: 'task', l: 'Task' }, { k: 'b', l: 'Billable', n: 1, f: function (x) { return fh(x.b); } }, { k: 'n', l: 'Non-billable', n: 1, f: function (x) { return fh(x.n); } }, { k: 'tot', l: 'Total', n: 1, f: function (x) { return fh(x.tot); } }];
  var pcols = [{ k: 'name', l: 'Person' }, { k: 'b', l: 'Billable', n: 1, f: function (x) { return fh(x.b); } }, { k: 'n', l: 'Non-billable', n: 1, f: function (x) { return fh(x.n); } }, { k: 'tot', l: 'Total', n: 1, f: function (x) { return fh(x.tot); } }];
  var foot = ['Total', fh(r.b), fh(r.n), fh(r.tot)];
  h += '<div class="grid2"><div>' + table('lktask', cols, r.tasks, { foot: foot, sort: { k: 'tot', asc: false }, csv: 'wo-' + L.wo + '-hours-by-task' }) + '</div><div>' + table('lkpeople', pcols, r.people, { foot: foot, sort: { k: 'tot', asc: false }, csv: 'wo-' + L.wo + '-hours-by-person' }) + '</div></div>';
  if (hasRoll && L.roll) h += '<p class="sub" style="margin-top:8px">This WO number alone: ' + fh(own.b) + ' billable, ' + fh(own.n) + ' non-billable, ' + fh(own.tot) + ' total.</p>';
  h += '<div class="row" style="margin-top:10px">' + csvBtn('lktask') + '</div>';
  $('#lookup').innerHTML = h; wrap.hidden = false;
}
$('#woFind').addEventListener('input', showSug);
$('#woFind').addEventListener('focus', function () { if (this.value) showSug(); });
$('#woFind').addEventListener('keydown', function (e) {
  var box = $('#woSug');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (!sugList.length) return; e.preventDefault(); sugIx = (sugIx + (e.key === 'ArrowDown' ? 1 : -1) + sugList.length) % sugList.length; box.querySelectorAll('button').forEach(function (b, i) { b.classList.toggle('on', i === sugIx); }); }
  else if (e.key === 'Enter') { e.preventDefault(); var q = this.value.trim(); if (!q || !App.M) return; var pick = sugIx >= 0 && sugList[sugIx] ? sugList[sugIx].wo : q; openLookup(pick); this.blur(); }
  else if (e.key === 'Escape') { box.hidden = true; if (!this.value) closeLookup(); }
});
document.addEventListener('mousedown', function (e) { if (!e.target.closest('#finder')) $('#woSug').hidden = true; });
$('#woSug').addEventListener('click', function (e) { var b = e.target.closest('[data-pick]'); if (b) openLookup(b.getAttribute('data-pick')); });
document.addEventListener('keydown', function (e) { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) { e.preventDefault(); $('#woFind').focus(); } else if (e.key === 'Escape' && App.lookup && document.activeElement !== $('#woFind')) closeLookup(); });
$('#lookupWrap').addEventListener('change', function (e) { if (e.target.id === 'lkRoll') { App.lookup.roll = e.target.checked; renderLookup(); } });

/* ---------------- picking and refreshing the workbook file ---------------- */
var canPick = typeof window.showOpenFilePicker === 'function';
var PICK_OPTS = { types: [{ description: 'Excel workbook', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'], 'application/vnd.ms-excel.sheet.macroEnabled.12': ['.xlsm'], 'application/vnd.ms-excel.sheet.binary.macroEnabled.12': ['.xlsb'] } }], multiple: true };
// remembered file handles, one per workbook name, so Refresh can re-read both
function handleGet() { return idb('readonly', function (st) { return st.get('handles'); }).then(function (h) { return h || {}; }); }
function handleSet(hs) { return handleGet().then(function (all) { hs.forEach(function (h) { all[h.name] = h; }); return idb('readwrite', function (st) { st.put(all, 'handles'); }); }); }
function pickFile() {
  if (!canPick) { $('#file').click(); return; }
  window.showOpenFilePicker(PICK_OPTS).then(function (hs) { handleSet(hs); return Promise.all(hs.map(function (h) { return h.getFile(); })); }).then(function (fs) { handleFiles(fs); })
    .catch(function (e) { if (e && e.name === 'AbortError') return; canPick = false; $('#file').click(); });
}
function refreshFile() {
  if (!canPick) { toast('Pick the saved workbook again to reload it.', 4000); $('#file').click(); return; }
  handleGet().then(function (all) {
    var hs = Object.keys(all).map(function (k) { return all[k]; });
    if (!hs.length) { toast('Pick the workbook(s) once; after that Refresh re-reads them with one click.', 5000); pickFile(); return; }
    return hs.reduce(function (p, h) { return p.then(function (ok) { var q = h.queryPermission ? h.queryPermission({ mode: 'read' }) : Promise.resolve('granted'); return q.then(function (s) { return s === 'granted' ? s : h.requestPermission({ mode: 'read' }); }).then(function (s) { return ok && s === 'granted'; }); }); }, Promise.resolve(true)).then(function (ok) {
      if (!ok) { toast('The browser needs permission to read the workbooks. Click Refresh again and choose Allow.', 6000); return; }
      return Promise.all(hs.map(function (h) { return h.getFile(); })).then(function (fs) {
        var prev = (App.meta && App.meta.lastModified) || {};
        var changed = fs.filter(function (f) { return typeof prev !== 'object' || prev[f.name] !== f.lastModified; });
        if (!changed.length) { toast('No changes since the last load. In Excel: Data → Refresh All, wait for it to finish, then Save. Then click Refresh here.', 8000); return; }
        handleFiles(changed);
      });
    });
  }).catch(function (e) {
    console.error(e);
    toast(e && e.name === 'NotFoundError' ? 'The workbook was moved or renamed. Pick it again.' : e && e.name === 'NotReadableError' ? 'The file is busy. Let Excel finish saving, then click Refresh again.' : 'Could not re-read the workbook. Pick it again.', 7000);
    if (e && e.name === 'NotFoundError') pickFile();
  });
}
$('#file').addEventListener('change', function () { var fs = Array.prototype.slice.call(this.files || []); this.value = ''; if (fs.length) handleFiles(fs); });

/* ---------------- data loading, sharing, caching ---------------- */
function idb(mode, fn) {
  return new Promise(function (res) {
    try {
      var rq = indexedDB.open('pct', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
      rq.onsuccess = function () { try { var tx = rq.result.transaction('kv', mode), st = tx.objectStore('kv'), r = fn(st); tx.oncomplete = function () { res(r && r.result); }; tx.onerror = function () { res(null); }; } catch (e) { res(null); } };
      rq.onerror = function () { res(null); };
    } catch (e) { res(null); }
  });
}
function cacheGet() { return idb('readonly', function (st) { return st.get('current'); }); }
function cacheSet(v) { return idb('readwrite', function (st) { st.put(v, 'current'); }); }
function rebuild() { if (!App.ds) return; try { App.M = Core.buildModel(App.ds, App.saved); } catch (e) { console.error(e); toast('Could not rebuild: ' + e.message); } render(); }
function useDataset(ds, meta) { App.ds = ds; App.meta = meta; App.M = null; rebuild(); resolveUploader(); }
function resolveUploader() {
  var m = App.meta; if (!m || !m.uploadedBy || !App.caps.user || m.uploaderName) return;
  try { App.caps.user.profiles([m.uploadedBy]).then(function (ps) { var p = ps && ps[m.uploadedBy]; if (p && p.name && App.meta === m) { m.uploaderName = p.name; renderInfo(); } }).catch(function () {}); } catch (e) {}
}
function handleFile(file) { handleFiles([file]); }
function readBuf(file) { return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(new Uint8Array(fr.result)); }; fr.onerror = function () { rej(new Error('Could not open ' + file.name)); }; fr.readAsArrayBuffer(file); }); }
function handleFiles(files) {
  if (typeof XLSX === 'undefined') { toast('The spreadsheet reader did not load. Check your connection and reload.'); return; }
  files = Array.prototype.slice.call(files || []); if (!files.length) return;
  toast('Reading ' + files.map(function (f) { return f.name; }).join(' and ') + '…', 60000);
  var merged = App.ds, done = [], lm = {};
  files.reduce(function (p, file) {
    return p.then(function () { return readBuf(file); }).then(function (buf) {
      return new Promise(function (res) { setTimeout(function () {
        try { var part = Core.parseWorkbook(XLSX, buf, file.name); merged = Core.mergeDatasets(merged && merged.pt ? merged : null, part); done.push(file.name); lm[file.name] = file.lastModified || null; }
        catch (e) { console.error(e); toast(file.name + ': ' + (e.message || 'could not be read as a workbook.'), 8000); }
        res();
      }, 20); });
    });
  }, Promise.resolve()).then(function () {
    if (!done.length) return;
    var ds = merged;
    (function () {
      var file = { name: done.join(' + ') };
      var meta = { fileName: ds.file || file.name, lastModified: lm, uploadedAt: new Date().toISOString(), uploadedBy: App.uid || null, local: true, maxDay: ds.counts.maxDay, entries: ds.counts.entries };
      var before = App.ds ? App.ds.counts : null;
      useDataset(ds, meta);
      cacheSet({ ds: ds, meta: meta });
      if (before && (!App.caps.assets || !App.canEdit)) { var add = ds.counts.entries - before.entries; toast('Loaded ' + done.join(' and ') + '. ' + (add > 0 ? add.toLocaleString() + ' new time entries · ' : '') + 'time logged through ' + fd(ds.counts.maxDay) + '.', 6000); return; }
      if (ds.warn && ds.warn.length) setTimeout(function () { toast(ds.warn.join(' '), 7000); }, 6500);
      shareDataset(ds, meta);
    })();
  });
}
function shareDataset(ds, meta) {
  var A = App.caps.assets, db = App.caps.db;
  if (!A || !db || !App.canEdit) { toast('Loaded ' + ds.counts.entries.toLocaleString() + ' entries. This upload is only on this device.', 6000); return; }
  toast('Sharing the new data with your team…', 60000);
  var blob = new Blob([JSON.stringify(ds)], { type: 'application/json' });
  A.upload(blob, { type: 'application/json' }).then(function (r) {
    var doc = { assetId: r.id, fileName: meta.fileName, uploadedAt: meta.uploadedAt, uploadedBy: App.uid || null, maxDay: ds.counts.maxDay, entries: ds.counts.entries };
    pendingAsset = r.id;
    return db.doc('meta/current').set(doc).then(function () { return db.collection('uploads').doc(r.id).set(doc); }).then(function () {
      meta.local = false; meta.assetId = r.id; App.meta = Object.assign(meta, doc); cacheSet({ ds: ds, meta: App.meta }); renderInfo(); resolveUploader();
      toast('Uploaded. Everyone who opens the app now sees this data.', 5000);
    });
  }).catch(function (e) { console.error(e); toast(e && e.code === 'too_large' ? 'The workbook data is too large to share (20 MB limit). It is loaded on this device only.' : 'Loaded here, but sharing failed (' + (e && e.code || 'error') + '). Try uploading again.', 8000); });
}
var pendingAsset = null, loadingAsset = null;
function loadFromAsset(m, explicit) {
  if (!m || !m.assetId || loadingAsset === m.assetId) return Promise.resolve();
  loadingAsset = m.assetId;
  if (explicit) toast('Loading that version…', 30000);
  return fetch('/_blob/' + m.assetId).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function (ds) {
    if (!ds || !ds.pt) throw new Error('bad data');
    var meta = Object.assign({}, m, { local: false });
    if (explicit && App.meta && App.meta.assetId !== m.assetId) {
      var hist = (App.ui.data.hist || []).filter(function (h) { return h.assetId === m.assetId; })[0];
      if (hist) Object.assign(meta, hist); meta.historical = true;
    }
    useDataset(ds, meta);
    if (!explicit) cacheSet({ ds: ds, meta: meta });
    if (explicit) toast('Showing the upload from ' + (meta.uploadedAt ? new Date(meta.uploadedAt).toLocaleDateString() : 'earlier') + '. Reload the app to return to the latest.', 6000);
  }).catch(function (e) { console.error(e); if (explicit || !App.ds) toast('Could not load the shared data. Try reloading, or upload the workbook again.', 7000); })
    .then(function () { loadingAsset = null; });
}
function loadHistory() {
  var db = App.caps.db; if (!db) return; App.ui.data.histLoading = true;
  db.collection('uploads').orderBy('uploadedAt', 'desc').limit(25).get().then(function (snap) {
    var rows = snap.docs.map(function (d) { var x = Object.assign({}, d.data()); return x; });
    var ids = rows.map(function (r) { return r.uploadedBy; }).filter(Boolean);
    var done = function () { App.ui.data.hist = rows; App.ui.data.histLoading = false; if (App.view === 'data') render(); };
    if (App.caps.user && ids.length) App.caps.user.profiles(ids).then(function (ps) { rows.forEach(function (r) { var p = ps && ps[r.uploadedBy]; r.who = p && p.name ? p.name : ''; }); done(); }).catch(done); else done();
  }).catch(function () { App.ui.data.hist = []; App.ui.data.histLoading = false; if (App.view === 'data') render(); });
}
function saveSettings(s) {
  var db = App.caps.db; if (!db) return;
  var p = s ? db.doc('meta/settings').set(s) : db.doc('meta/settings').delete();
  p.then(function () { App.saved = s; rebuild(); toast(s ? 'Settings saved for everyone.' : 'Back to the workbook values for everyone.'); })
    .catch(function (e) { toast('Settings were not saved (' + (e && e.code || 'error') + ').'); });
}

/* ---------------- boot ---------------- */
function boot() {
  var saved = lsGet('ui', null); if (saved) Object.keys(App.ui).forEach(function (k) { if (saved[k]) App.ui[k] = saved[k]; });
  App.ui.wo.sel = null; App.ui.data = {}; Object.keys(App.ui).forEach(function (k) { if (k.indexOf('more_') === 0) delete App.ui[k]; });
  App.sort = lsGet('sort', {}) || {};
  var hv = location.hash.slice(1); App.view = VIEW_FN[hv] ? hv : (lsGet('view', 'efficiency') || 'efficiency');
  if (!VIEW_FN[App.view]) App.view = 'efficiency';
  render();
  var local = lsGet('settings', null);
  cacheGet().then(function (c) { if (c && c.ds && !App.ds) { if (!App.caps.db) App.saved = local; useDataset(c.ds, c.meta || {}); } else if (!App.ds) render(); });
  var C = window.claude;
  if (!C || !C.use) {
    App.saved = local;
    // Hosted outside Claude (e.g. GitHub Pages): plain browser downloads for CSV export
    App.caps.downloads = { save: function (o) { var u = URL.createObjectURL(o.data), a = document.createElement('a'); a.href = u; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 2000); return Promise.resolve(); } };
    render(); return;
  }
  Promise.all([C.use('db'), C.use('user'), C.use('assets'), C.use('downloads')]).then(function (r) {
    App.caps.db = r[0]; App.caps.user = r[1]; App.caps.assets = r[2]; App.caps.downloads = r[3];
    var u = App.caps.user;
    if (u) { try { App.canEdit = !!u.canEdit(); } catch (e) {} try { u.id().then(function (id) { App.uid = id; }).catch(function () {}); } catch (e) {} }
    if (!App.caps.db) { App.saved = local; if (App.ds) rebuild(); else render(); return; }
    App.caps.db.doc('meta/settings').onSnapshot(function (s) { App.saved = s.exists ? s.data() : null; if (App.ds) rebuild(); }, function () {});
    App.caps.db.doc('meta/current').onSnapshot(function (s) {
      if (!s.exists) { if (!App.ds) render(); return; }
      var m = s.data();
      if (App.meta && App.meta.assetId === m.assetId) { if (!App.meta.uploaderName) { App.meta = Object.assign({}, App.meta, m, { local: false }); resolveUploader(); renderInfo(); } return; }
      if (pendingAsset === m.assetId) return;
      if (App.meta && App.meta.historical) return;
      var had = !!App.ds;
      loadFromAsset(m).then(function () { if (had && App.meta && App.meta.assetId === m.assetId) toast('New data was uploaded and is now showing.'); });
    }, function () {});
    render();
  }).catch(function () { render(); });
}
boot();
})();
